line-length = 150
target-version = "py312"

[lint]
# Pin ruff's own default explicitly rather than relying on the implicit one:
# ruff 0.16 widened what "no select= configured" resolves to (see its
# "category selectors" changelog entry), which silently pulled in whole
# unselected plugins (flake8-datetimez, flake8-blind-except, flake8-pyi,
# flake8-async, ...) the first time this project bumped past 0.15.20. Being
# explicit about the base keeps `extend-select` below meaning what it says.
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "I", # import sorting (isort)
    "PL", # pylint-compatible rules (subset)
    "UP", # pyupgrade
    "B", # bugbear
    "SIM", # flake8-simplify
    "C4", # comprehensions
    "ERA", # eradicate (commented-out code)
    "W", # pycodestyle warnings
    "RUF", # Ruff-specific rules
]

ignore = [
    # add ignores as needed
]

[lint.pylint]
allow-magic-value-types = ["str", "int"]

[format]
quote-style = "double"
