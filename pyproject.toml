[project]
name = "opencode-swap"
version = "0.1.0"
description = "Multi-account switcher for OpenCode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Linux only: Secret Service backend for the account secret store.
    # macOS goes through the pinned `security` CLI instead (see
    # macos_keychain.py) — same reasoning claude-swap documents: a stable
    # binary means creator == reader, so an interpreter rebuild doesn't
    # trigger a "wants to use your keychain" re-prompt.
    "keyring>=25.0.0; sys_platform == 'linux'",
]
authors = [{email = "leinardi@gmail.com"}]
license = {text = "MIT"}
keywords = ["opencode", "account-switcher", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.scripts]
opencode-swap = "opencode_swap.cli:main"
ocs = "opencode_swap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_swap"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
