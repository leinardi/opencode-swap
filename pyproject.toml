[project]
name = "opencode-swap"
version = "0.2.0"
description = "Multi-account switcher for OpenCode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Standard WinZip AES implementation for explicit portable exports.
    # Credential plaintext stays in memory; no home-grown crypto format.
    "pyzipper>=0.4.0",
    # AES-256-GCM for the macOS Keychain envelope format (sealed.py).
    # Already a transitive dependency of pyzipper; declared directly here
    # because sealed.py imports it independently of transfer.py.
    "pycryptodomex>=3.19.0",
]
authors = [{ name = "roberto@leinardi.com" }]
license = { text = "MIT" }
keywords = ["opencode", "account-switcher", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.scripts]
opencode-swap = "opencode_swap.cli:main"
ocs = "opencode_swap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_swap"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
