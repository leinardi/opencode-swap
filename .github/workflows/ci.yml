name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Same cache key/path as the pr-lint.yml reviewdog actions, so a cache
      # warmed by either workflow is reused by the other.
      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}
      # `make check` (part of `make verify`) shells out to the bare
      # `pre-commit` binary, not `uv run pre-commit` - install it directly.
      - run: pip install pre-commit
      - run: make verify
