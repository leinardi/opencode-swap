name: Publish TUI Plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # gh release create below.
      contents: write
      # npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1
      - name: Verify release version
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag must be v$VERSION, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      # npm publish below runs with --ignore-scripts, so prepublishOnly will
      # not build; compile the entry explicitly before verifying or publishing.
      - name: Build plugin entry
        run: bun run build
      - name: Run unit tests
        run: bun run test
      - name: Verify package
        run: bun run check
      - name: Verify npm peer resolution
        run: ./scripts/check-npm-resolution.sh .
      - name: Verify compiled entry
        run: ./scripts/check-tui-entry-compiled.sh .
      - name: Check existing version
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "@leinardi/opencode-swap@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "@leinardi/opencode-swap@$PACKAGE_VERSION is already published" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # npm moves `latest` to whatever is published without --tag. Once 1.x
      # (OpenCode 2) is out, a 0.4.x maintenance release (OpenCode 1) must not
      # take `latest` back: `opencode plugin add` and OpenCode 1's bare-name
      # resolution both install `latest`.
      - name: Choose npm dist-tag
        id: disttag
        if: steps.registry.outputs.published != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          # No fallback on failure: guessing `latest` here could hand it to an
          # older line. The package exists, so the lookup must succeed.
          LATEST=$(npm view @leinardi/opencode-swap dist-tags.latest)
          TAG=latest
          if [ -n "$LATEST" ] && [ "$LATEST" != "$PACKAGE_VERSION" ] \
            && [ "$(printf '%s\n%s\n' "$PACKAGE_VERSION" "$LATEST" | sort -V | head -n1)" = "$PACKAGE_VERSION" ]; then
            TAG=legacy
          fi
          echo "Publishing $PACKAGE_VERSION with dist-tag $TAG (current latest: ${LATEST:-none})"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish with npm provenance
        if: steps.registry.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: npm publish --access public --provenance --ignore-scripts --tag "$DIST_TAG"
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
