name: Publish TUI Plugin

on:
  push:
    tags: ["tui-v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1
      - name: Verify release version
        id: package
        working-directory: integrations/opencode-tui-plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "tui-v$VERSION" ]; then
            echo "Tag must be tui-v$VERSION, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Install locked dependencies
        run: bun install --cwd integrations/opencode-tui-plugin --frozen-lockfile
      # npm publish below runs with --ignore-scripts, so prepublishOnly will
      # not build; compile the entry explicitly before verifying or publishing.
      - name: Build plugin entry
        run: bun run --cwd integrations/opencode-tui-plugin build
      - name: Verify package
        run: bun run --cwd integrations/opencode-tui-plugin check
      - name: Verify npm peer resolution
        run: ./scripts/check-npm-resolution.sh integrations/opencode-tui-plugin
      - name: Verify compiled entry
        run: ./scripts/check-tui-entry-compiled.sh integrations/opencode-tui-plugin
      - name: Check existing version
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "@leinardi/opencode-swap@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "@leinardi/opencode-swap@$PACKAGE_VERSION is already published" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm provenance
        if: steps.registry.outputs.published != 'true'
        working-directory: integrations/opencode-tui-plugin
        run: npm publish --access public --provenance --ignore-scripts
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
