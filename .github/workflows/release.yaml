name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.4.0 or v0.4.0) - bumps the CLI and TUI plugin together"
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Needed for the explicit `gh workflow run` calls below - a
      # GITHUB_TOKEN-authored push/PR does not fire other workflows'
      # push/pull_request triggers (GitHub's loop-prevention), so without
      # dispatching ci.yml/pr-lint.yml ourselves the opened PR's required
      # `verify` check would never appear and could never be merged.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate and normalize version
        id: version
        run: |
          set -euo pipefail
          RAW="${{ inputs.version }}"
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like X.Y.Z (got '${{ inputs.version }}')" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version in pyproject.toml, __init__.py, package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/opencode_swap/__init__.py
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" integrations/opencode-tui-plugin/package.json

      - name: Regenerate lockfiles
        run: |
          set -euo pipefail
          uv lock
          bun install --cwd integrations/opencode-tui-plugin

      - name: Commit and push bump branch
        id: branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="release/v$VERSION"
          git switch -c "$BRANCH"
          git add pyproject.toml src/opencode_swap/__init__.py \
            integrations/opencode-tui-plugin/package.json \
            uv.lock integrations/opencode-tui-plugin/bun.lock
          if git diff --cached --quiet; then
            echo "Nothing changed - is $VERSION already the current version?" >&2
            exit 1
          fi
          git commit -m "chore(release): bump version to $VERSION"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): bump version to $VERSION" \
            --body "Automated version bump. Review the diff, then merge — merging triggers \`auto-tag-release.yml\`, which tags \`v$VERSION\` and \`tui-v$VERSION\`, creates both GitHub releases, and publishes to PyPI and npm."

      - name: Trigger CI checks on the bump branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run pr-lint.yml --ref "$BRANCH"
