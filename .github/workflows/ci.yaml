name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Needed so release.yaml's bump-and-PR job can explicitly dispatch this
  # against its branch: a GITHUB_TOKEN-authored push/PR does not fire other
  # workflows' push/pull_request triggers (GitHub's loop-prevention), so
  # without an explicit `gh workflow run ci.yaml --ref <branch>` the PR's
  # required checks would never appear.
  workflow_dispatch:

# A newer push to a pull request supersedes its older run; runs on main always finish, so
# every commit on main keeps its own result.
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # `make verify` resolves the packed TUI plugin with npm, whose peer
      # behaviour is what OpenCode's installer actually exercises - pin the
      # runtime instead of inheriting whatever npm the runner image ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Same cache key/path as the reviewdog actions below, so a cache
      # warmed by either is reused by the other.
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}
      # `make check` (part of `make verify`) shells out to the bare
      # `pre-commit` binary, not `uv run pre-commit` - install it directly.
      - run: pip install pre-commit
      - run: make verify

  actionlint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  markdownlint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  mypy:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run mypy via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/mypy@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  ruff:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run ruff via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/ruff@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    # commitizen derives the release version from the commit types since the last tag, so a
    # commit nobody can classify is a release nobody can version. The local commit-msg hook only
    # runs where `make pre-commit-install` was run; this job is the check that no commit skips.
    # It runs the repository's own conventional-pre-commit hook, so --force-scope applies here
    # too, and it skips merge commits. No pull-request title check: squash merging is disabled,
    # so a title never becomes a commit on main.
    #
    # Unlike the reviewdog jobs, this one also runs on workflow_dispatch: release.yaml opens its
    # bump pull request with GITHUB_TOKEN and dispatches this workflow on the bump branch, so the
    # check reports on that pull request even if its pull_request event never fires. A dispatch
    # checks the commits between main and the dispatched ref. A push to main has nothing left to
    # check: every commit on it arrived through a pull request.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          to-ref: ${{ github.event.pull_request.head.sha || 'HEAD' }}
