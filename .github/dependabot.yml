version: 2
enable-beta-ecosystems: true # Required for the pre-commit and uv ecosystems

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/integrations/opencode-tui-plugin"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "tui-plugin"]
    groups:
      tui-plugin-dependencies:
        patterns:
          - "*"
