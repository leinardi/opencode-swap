version: 2
enable-beta-ecosystems: true # Required for the pre-commit and uv ecosystems

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/integrations/opencode-tui-plugin"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "tui-plugin"]
    ignore:
      # typescript-eslint 8.x peer range is `typescript >=4.8.4 <6.1.0` and its
      # config throws "typescript-eslint does not support TS 7.0." at load time,
      # breaking the lint hook. Drop this once typescript-eslint widens its range.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      tui-plugin-dependencies:
        patterns:
          - "*"
