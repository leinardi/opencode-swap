version: 2

# Every ecosystem uses chore(deps), which commitizen does not count as a release. Almost none of
# these bumps changes what users install: the TUI plugin's runtime packages are optional peers
# that OpenCode provides, and its development dependencies never ship. The exception is
# @opentui/solid, whose transform compiles dist/. When a bump should ship (a changed plugin
# build), release it in a fix(deps) commit or with an explicit version.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "tui-plugin"]
    ignore:
      # typescript-eslint 8.x peer range is `typescript >=4.8.4 <6.1.0` and its
      # config throws "typescript-eslint does not support TS 7.0." at load time,
      # breaking the lint hook. Drop this once typescript-eslint widens its range.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # The published peers pin @opentui to 0.5.x (26562a3); building and
      # typechecking against 0.6 would ship output the peer range never tested.
      # Move the peers and these together, by hand, when moving to 0.6.
      - dependency-name: "@opentui/*"
        versions: [">=0.6.0"]
      # @opencode/plugin and @opencode/theme are pinned to the oldest OpenCode 2 the plugin
      # supports (engines.opencode), so the typecheck catches an API newer than that: merge a
      # 2.x bump only together with raising engines.opencode. 3.x is a different host API
      # altogether.
      - dependency-name: "@opencode/*"
        versions: [">=3.0.0"]
    groups:
      tui-plugin-dependencies:
        patterns:
          - "*"
