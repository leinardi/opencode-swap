version: 2

# Every ecosystem uses chore(deps), which commitizen does not count as a release. Almost none of
# these bumps changes what users install: pyproject.toml declares the runtime dependencies as
# lower bounds, so Dependabot only moves uv.lock, and the TUI plugin's runtime packages are peers
# that OpenCode provides. The exception is @opentui/solid, whose transform compiles
# dist/tui.js. When a bump should ship (a fix in a lower bound, a changed plugin build), raise
# the bound in a fix(deps) commit or release with an explicit version.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "python"]
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/integrations/opencode-tui-plugin"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "tui-plugin"]
    ignore:
      # typescript-eslint 8.x peer range is `typescript >=4.8.4 <6.1.0` and its
      # config throws "typescript-eslint does not support TS 7.0." at load time,
      # breaking the lint hook. Drop this once typescript-eslint widens its range.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      tui-plugin-dependencies:
        patterns:
          - "*"
